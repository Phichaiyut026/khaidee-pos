<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบหลังร้าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    body {
      display: grid; place-items: center; min-height: 100vh; padding: 16px;
      background:
        radial-gradient(50% 50% at 15% 10%, rgba(124, 58, 237, .35), transparent 70%),
        radial-gradient(45% 45% at 90% 90%, rgba(79, 70, 229, .35), transparent 70%),
        #12142a;
    }
    .box { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 32px; border: 0; box-shadow: 0 30px 70px rgba(0, 0, 0, .35); animation: pop .3s ease; }
    .box .logo { width: 52px; height: 52px; font-size: 24px; border-radius: 15px; }
    .box h1 { margin-top: 6px; }
    .err { color: var(--danger); font-size: 14px; min-height: 1.2em; }
    .foot { text-align: center; color: rgba(255, 255, 255, .45); font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <div>
    <form class="card box" id="f">
      <div class="logo">P</div>
      <div>
        <h1>ยินดีต้อนรับกลับมา</h1>
        <p class="muted" style="margin:4px 0 0">เข้าสู่ระบบหลังร้าน / POS</p>
      </div>
      <label class="field">รหัสผ่าน
        <input class="input" type="password" name="password" autofocus required autocomplete="current-password" placeholder="••••••••">
      </label>
      <div class="err" id="err"></div>
      <button class="btn primary lg" type="submit">เข้าสู่ระบบ</button>
    </form>
    <div class="foot">ระบบขายหน้าร้าน · สินค้า · แชทรวม</div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: e.target.password.value }),
      });
      if (res.ok) location.href = '/admin/';
      else document.getElementById('err').textContent = (await res.json()).error;
    });
  </script>
</body>
</html>
